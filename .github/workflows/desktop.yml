name: Desktop compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-xinerama0 libpulse-mainloop-glib0
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_desktop_portability.py
      - run: python tests/test_shared_assembly.py
      - run: python tests/test_frame_review.py
      - run: python tests/test_correction_propagation.py
      - run: python tests/test_instance_edits.py
      - run: python tests/test_noun_aliases.py
      - run: python tests/test_task_assets.py
      - run: python tests/test_task_bundle_gui.py
  sam-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SAM2_BUILD_CUDA: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Linux image runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - run: python -m pip install wheel setuptools
      - name: PyTorch CPU on Linux and Windows
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: PyTorch on macOS
        if: runner.os == 'macOS'
        run: python -m pip install torch==2.5.1 torchvision==0.20.1
      - run: git clone https://github.com/facebookresearch/sam2.git .deps/sam2
      - run: git -C .deps/sam2 checkout 2b90b9f5ceec907a1c18123530e92e794ad901a4
      - run: python -m pip install --no-build-isolation -e .deps/sam2
      - name: Download official Small checkpoint
        run: python -c "import urllib.request; urllib.request.urlretrieve('https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_small.pt', 'sam2.1_hiera_small.pt')"
      - run: python tests/test_sam_cpu_backend.py sam2.1_hiera_small.pt
