name: Desktop compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-xinerama0 libpulse-mainloop-glib0
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_desktop_portability.py
      - run: python tests/test_shared_assembly.py
      - run: python tests/test_frame_review.py
      - run: python tests/test_correction_propagation.py
      - run: python tests/test_instance_edits.py
      - run: python tests/test_noun_aliases.py
      - run: python tests/test_task_assets.py
      - run: python tests/test_task_bundle_gui.py
      - run: python tests/test_current_annotation.py
      - run: python tests/test_safe_storage.py
      - run: python tests/test_autosave_gui.py
      - run: python tests/test_save_guard_gui.py
      - run: python tests/test_offset_save_gui.py
      - run: python tests/test_label_guide_gui.py
      - run: python tests/test_editor_interactions_gui.py
