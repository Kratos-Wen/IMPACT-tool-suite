name: Desktop compatibility
on:
  push:
    paths:
      - '**/*.py'
      - '!audio_review/**'
      - '!tests/test_audio_review_browser.py'
      - 'configs/**'
      - 'project_profile.json'
      - 'feature_defaults.json'
      - 'runner_envs.json'
      - 'requirements*.txt'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - '**/*.py'
      - '!audio_review/**'
      - '!tests/test_audio_review_browser.py'
      - 'configs/**'
      - 'project_profile.json'
      - 'feature_defaults.json'
      - 'runner_envs.json'
      - 'requirements*.txt'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      IMPACT_USE_BUNDLED_PROFILE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-xinerama0 libpulse-mainloop-glib0
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_desktop_portability.py
      - run: python tests/test_video_priority_layout_gui.py
      - run: python tests/test_shared_assembly.py
      - run: python tests/test_object_states.py
      - run: python tests/test_instance_state_gui.py
      - run: python tests/test_assembly_fastener_policy.py
      - run: python tests/test_assembly_instances.py
      - run: python tests/test_review_assembly_instances.py
      - run: python tests/test_frame_review.py
      - run: python tests/test_frame_review_navigation.py
      - run: python tests/test_local_instances.py
      - run: python tests/test_instrument_roles_gui.py
      - run: python tests/test_noun_constraints.py
      - run: python tests/test_keyframe_workflow_gui.py
      - run: python tests/test_box_import.py
      - run: python tests/test_reviewed_import_guards_gui.py
      - run: python tests/test_annotation_refs.py
      - run: python tests/test_frame_copy_gui.py
      - run: python tests/test_video_validation_gui.py
      - run: python tests/test_reviewer_notes_gui.py
      - run: python tests/test_bbox_navigation_gui.py
      - run: python tests/test_sparse_library_navigation_gui.py
      - run: python tests/test_manual_frame_display_gui.py
      - run: python tests/test_new_entity_search_gui.py
      - run: python tests/test_manual_only_workflow_gui.py
      - run: python tests/test_hand_only_vocabulary_gui.py
      - run: python tests/test_stable_hand_identity_gui.py
      - run: python tests/test_first_annotation_journey_gui.py
      - run: python tests/test_canvas_gestures_gui.py
      - run: python tests/test_correction_propagation.py
      - run: python tests/test_instance_edits.py
      - run: python tests/test_instance_registry_gui.py
      - run: python tests/test_singleton_instances.py
      - run: python tests/test_singleton_instances_gui.py
      - run: python tests/test_noun_aliases.py
      - run: python tests/test_taxonomy_cache.py
      - run: python tests/test_task_assets.py
      - run: python tests/test_repository_profile.py
      - run: python tests/test_task_bundle_gui.py
      - run: python tests/test_task_hands_gui.py
      - run: python tests/test_current_annotation.py
      - run: python tests/test_safe_storage.py
      - run: python tests/test_autosave_gui.py
      - run: python tests/test_editor_snapshot.py
      - run: python tests/test_editor_performance_gui.py
      - run: python tests/test_completion_render_cache_gui.py
      - run: python tests/test_video_preview_gui.py
